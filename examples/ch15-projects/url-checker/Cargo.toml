[package]
name = "url-checker"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.3", default-features = false, features = ["rt", "macros", "net", "time", "sync", "signal"] }
url = "2.5.8"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tempfile = "3.27.0"
