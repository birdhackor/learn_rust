[package]
name = "ch03-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# TOML 中以 # 開頭的行是註解，不會改變設定。
# [lints.clippy] 設定這個 package 的 Clippy 提醒級別。
# manual_map 是工具對 match 寫法提出簡化建議的一項提醒名稱。
# "allow" 讓此項不報提醒，保留本章已教的 match；其他檢查照常。
[lints.clippy]
manual_map = "allow"
