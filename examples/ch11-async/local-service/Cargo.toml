[package]
name = "ch11-local-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# --8<-- [start:dependencies]
[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
ch11-http-single = { path = "../http-single" }
tokio = { version = "1.53.3", default-features = false, features = ["rt", "macros", "net", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1.53.3", default-features = false, features = ["test-util"] }
# --8<-- [end:dependencies]
