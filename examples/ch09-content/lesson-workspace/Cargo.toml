[workspace]
members = ["size", "streams", "checked-files", "groups"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
ch09-files = { path = "../../ch09-files" }
lesson-content-streams = { path = "streams" }
lesson-checked-files = { path = "checked-files" }
blake3 = "1.8"
tempfile = "3.27"

[profile.release]
opt-level = 3
overflow-checks = true
