[workspace]
members = ["subtotal", "app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
lesson-subtotal = { path = "subtotal" }

[workspace.lints.cargo]
unused_dependencies = "deny"

[profile.release]
opt-level = 3
overflow-checks = true
