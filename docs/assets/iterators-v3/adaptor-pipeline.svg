<svg xmlns="http://www.w3.org/2000/svg" width="400" height="760" viewBox="0 0 400 760" role="img" aria-labelledby="title desc">
  <title id="title">filter、map 與 collect 逐筆處理的型別</title>
  <desc id="desc">slice 的 iterator 交出 shared 數字；filter 借用這份 Item，因此參數有兩層 reference；map 收到原 Item，取出 Copy 數字乘十；collect 保存 owned i32。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315c89"/></marker></defs>
  <rect width="400" height="760" rx="16" fill="#f4f7fb"/>
  <g font-family="sans-serif" font-size="24" fill="#17324d">
    <text x="24" y="36">逐筆工作，各自的型別</text>
    <rect x="24" y="65" width="352" height="96" rx="12" fill="#fff" stroke="#315c89" stroke-width="2"/>
    <text x="42" y="103">1. values.iter()</text>
    <text x="42" y="139">Item：&amp;i32</text>
    <path d="M 76 163 V 205" stroke="#315c89" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="108" y="194">交出一筆 reference</text>
    <rect x="24" y="215" width="352" height="128" rx="12" fill="#e2efff" stroke="#315c89" stroke-width="2"/>
    <text x="42" y="253">2. filter</text>
    <text x="42" y="289">callback：&amp;&amp;i32 → bool</text>
    <text x="42" y="325">保留的 Item：&amp;i32</text>
    <path d="M 76 345 V 387" stroke="#315c89" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="108" y="376">true 才往下一步</text>
    <rect x="24" y="397" width="352" height="128" rx="12" fill="#fff" stroke="#315c89" stroke-width="2"/>
    <text x="42" y="435">3. map</text>
    <text x="42" y="471">callback：&amp;i32 → i32</text>
    <text x="42" y="507">取 Copy 數字乘 10</text>
    <path d="M 76 527 V 569" stroke="#315c89" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="108" y="558">新 Item：i32</text>
    <rect x="24" y="579" width="352" height="96" rx="12" fill="#e4f4e9" stroke="#315c89" stroke-width="2"/>
    <text x="42" y="617">4. collect 到 Vec&lt;i32&gt;</text>
    <text x="42" y="653">結果：[0, 30, 30]</text>
    <text x="24" y="724">collect 反覆 next 帶動前面</text>
  </g>
</svg>
