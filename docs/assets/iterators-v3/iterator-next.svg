<svg xmlns="http://www.w3.org/2000/svg" width="400" height="680" viewBox="0 0 400 680" role="img" aria-labelledby="title desc">
  <title id="title">Countdown 每次 next 的狀態與結果</title>
  <desc id="desc">remaining 從 3 減到 2、1、0，逐次交出 Some 3、2、1；下一次保持零並交出 None。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315c89"/></marker></defs>
  <rect width="400" height="680" rx="16" fill="#f4f7fb"/>
  <g font-family="sans-serif" font-size="24" fill="#17324d">
    <text x="24" y="36">next 更新狀態、交出 Item</text>
    <rect x="24" y="65" width="352" height="96" rx="12" fill="#fff" stroke="#315c89" stroke-width="2"/>
    <text x="42" y="103">1. remaining：3 → 2</text>
    <text x="42" y="139">next() → Some(3)</text>
    <path d="M 76 163 V 205" stroke="#315c89" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="108" y="194">同一份工作，再 next</text>
    <rect x="24" y="215" width="352" height="96" rx="12" fill="#fff" stroke="#315c89" stroke-width="2"/>
    <text x="42" y="253">2. remaining：2 → 1</text>
    <text x="42" y="289">next() → Some(2)</text>
    <path d="M 76 313 V 355" stroke="#315c89" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="108" y="344">同一份工作，再 next</text>
    <rect x="24" y="365" width="352" height="96" rx="12" fill="#fff" stroke="#315c89" stroke-width="2"/>
    <text x="42" y="403">3. remaining：1 → 0</text>
    <text x="42" y="439">next() → Some(1)</text>
    <path d="M 76 463 V 505" stroke="#315c89" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="108" y="494">同一份工作，再 next</text>
    <rect x="24" y="515" width="352" height="96" rx="12" fill="#e4f4e9" stroke="#315c89" stroke-width="2"/>
    <text x="42" y="553">4. remaining：0 → 0</text>
    <text x="42" y="589">next() → None</text>
    <text x="24" y="657">for 遇到第一個 None 就結束</text>
  </g>
</svg>
