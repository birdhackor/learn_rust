<svg width="340" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 420" role="img" aria-labelledby="title desc">
  <title id="title">兩個可能來源與共同 lifetime 要求</title>
  <desc id="desc">longer接受first與second，型別皆為帶a lifetime參數的str reference。輸出同樣是帶a參數的reference，可以借自任一來源。兩條箭頭表示可能來源，不代表同時回傳兩個值或複製文字；兩個來源都要滿足輸出使用的共同要求。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1d4ed8"/></marker></defs>
  <rect width="340" height="420" rx="12" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="20" fill="#172033">
    <text x="20" y="34" font-weight="bold">longer：回傳一份借用</text>
    <rect x="20" y="54" width="283" height="78" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="36" y="84">first：&amp;'a str</text>
    <text x="36" y="114">來源滿足 'a 的要求</text>
    <rect x="20" y="164" width="283" height="78" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="36" y="194">second：&amp;'a str</text>
    <text x="36" y="224">來源滿足 'a 的要求</text>
    <path d="M303 92H324V323H303" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M162 249V284" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="20" y="295" width="283" height="80" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <text x="36" y="325">輸出：&amp;'a str</text>
    <text x="36" y="356">共同要求，可能來自任一輸入</text>
    <text x="20" y="404">箭頭 = 可能的借用來源</text>
  </g>
</svg>
