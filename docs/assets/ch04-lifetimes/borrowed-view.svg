<svg width="340" height="330" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 330" role="img" aria-labelledby="title desc">
  <title id="title">TextView 保存 reference，外部 String 仍管理原內容</title>
  <desc id="desc">view是一個TextView，text欄位是帶a lifetime參數的str reference。它借用外部text變數持有的String內容Rust tutorial。箭頭表示borrowed關係，並沒有把String的ownership交進TextView。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1d4ed8"/></marker></defs>
  <rect width="340" height="330" rx="12" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="20" fill="#172033">
    <text x="20" y="34" font-weight="bold">欄位借用已有內容</text>
    <rect x="20" y="53" width="300" height="87" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="36" y="85">view：TextView&lt;'a&gt;</text>
    <text x="36" y="116">view.text：&amp;'a str</text>
    <path d="M72 146V198" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="94" y="176">箭頭 = 借用原內容</text>
    <rect x="20" y="210" width="300" height="89" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <text x="36" y="242">text：String，仍是 owner</text>
    <text x="36" y="274">管理的文字：Rust tutorial</text>
  </g>
</svg>
