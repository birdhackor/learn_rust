<svg width="340" height="504" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 504" role="img" aria-labelledby="title desc">
  <title id="title">slice 的範圍與相對索引</title>
  <desc id="desc">prices的五項值為80、120、200、60、40，array索引0到4。selected借用prices的1..4區間，包含120、200、60，不包含索引4。slice自己的索引是0、1、2，長度為3。框線標出原資料中被借的同一批元素。</desc>
  <rect width="340" height="504" rx="12" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="20" fill="#172033">
    <text x="20" y="34" font-weight="bold">同一段資料，兩種索引</text>
    <text x="19" y="73">array 索引</text>
    <text x="148" y="73">值</text>
    <text x="223" y="73">slice 索引</text>
    <rect x="119" y="144" width="203" height="216" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <text x="53" y="120">0</text><text x="148" y="120">80</text>
    <text x="53" y="190">1</text><text x="142" y="190">120</text><text x="263" y="190">0</text>
    <text x="53" y="260">2</text><text x="142" y="260">200</text><text x="263" y="260">1</text>
    <text x="53" y="330">3</text><text x="148" y="330">60</text><text x="263" y="330">2</text>
    <text x="53" y="400">4</text><text x="148" y="400">40</text>
    <text x="20" y="453" font-family="monospace" font-size="18">selected = &amp;prices[1..4]</text>
    <text x="20" y="485">借用三項，長度 3，上界 4 不含</text>
  </g>
</svg>
