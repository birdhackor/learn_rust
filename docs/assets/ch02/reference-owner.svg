<svg width="340" height="342" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 342" role="img" aria-labelledby="title desc">
  <title id="title">reference 借用原 Order，而不接手 ownership</title>
  <desc id="desc">order 持有單價120、數量3的 Order。reference 的型別為 &amp;Order，箭頭只借用同一筆資料。沒有建立另一份 Order。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1d4ed8"/></marker></defs>
  <rect width="340" height="342" rx="12" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="20" fill="#172033">
    <text x="22" y="34" font-weight="bold">同一筆資料，兩種角色</text>
    <rect x="20" y="51" width="300" height="82" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="36" y="83">reference：&amp;Order</text>
    <text x="36" y="112">借用，沒有接手訂單</text>
    <path d="M75 141V195" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="95" y="175">&amp;order 建立借用</text>
    <rect x="20" y="207" width="300" height="91" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <text x="36" y="239">order：仍是 owner</text>
    <text x="36" y="269">Order：單價 120，數量 3</text>
    <text x="22" y="326">借用同一筆 Order</text>
  </g>
</svg>
