<svg xmlns="http://www.w3.org/2000/svg" width="400" height="900" viewBox="0 0 400 900" role="img" aria-labelledby="title desc">
  <title id="title">ReadingValue derive 的編譯與執行階段</title>
  <desc id="desc">向下箭頭依序表示語法轉換與交付。編譯器將 Meters 宣告交成 compiler TokenStream，syn 解析名字、參數與欄位，quote 產生 impl 的 proc_macro2 TokenStream，轉換後交回編譯器。原宣告保留，增加 impl，Rust 檢查通過後 consumer 才建立值並借讀80。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#34516d"/></marker></defs>
  <g font-family="sans-serif" font-size="24" fill="#17324a" text-anchor="middle">
    <rect x="8" y="8" width="384" height="122" rx="12" fill="#eaf1fa" stroke="#34516d"/>
    <text x="200" y="42">1. 編譯器交入宣告</text>
    <text x="200" y="77">proc_macro::TokenStream</text>
    <text x="200" y="111">struct Meters(pub i32);</text>
    <path d="M200 135 V175" fill="none" stroke="#34516d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="8" y="185" width="384" height="132" rx="12" fill="#eaf1fa" stroke="#34516d"/>
    <text x="200" y="219">2. syn 解析成 AST</text>
    <text x="200" y="255">ident：Meters</text>
    <text x="200" y="292">參數0個、tuple 欄位1個</text>
    <path d="M200 322 V362" fill="none" stroke="#34516d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="8" y="372" width="384" height="122" rx="12" fill="#eaf1fa" stroke="#34516d"/>
    <text x="200" y="406">3. quote! 產生 impl 語法</text>
    <text x="200" y="441">proc_macro2::TokenStream</text>
    <text x="200" y="475">名字 #name 換成 Meters</text>
    <path d="M200 499 V543" fill="none" stroke="#34516d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="285" y="529">.into()</text>
    <rect x="8" y="555" width="384" height="122" rx="12" fill="#eaf1fa" stroke="#34516d"/>
    <text x="200" y="589">4. 交回編譯器</text>
    <text x="200" y="624">proc_macro::TokenStream</text>
    <text x="200" y="658">原宣告後增加 Reading impl</text>
    <path d="M200 682 V749" fill="none" stroke="#34516d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="84" y="696" width="232" height="38" fill="#ffffff"/>
    <text x="200" y="721">Rust 檢查通過後</text>
    <rect x="8" y="761" width="384" height="130" rx="12" fill="#eaf5e8" stroke="#3e6a3f"/>
    <text x="200" y="795">5. consumer 執行</text>
    <text x="200" y="831">value = Meters(80)</text>
    <text x="200" y="869">read_value(&amp;value) → 80</text>
  </g>
</svg>
