<svg xmlns="http://www.w3.org/2000/svg" width="390" height="645" viewBox="0 0 390 645" role="img" aria-labelledby="title desc">
<title id="title">準備與計時工作分開</title><desc id="desc">清單建置與正確性檢查在計時之外，箭頭表示之後選擇一種工作反覆執行。兩個框各自表示iter內的完整計數範圍，不是並行。借讀巡訪contains；owned複本另clone與收尾，兩者回相同行數。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs>
<rect width="390" height="645" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" font-size="24" fill="#0f172a">
<text x="195" y="38" text-anchor="middle" font-weight="bold">每次究竟計哪一段？</text>
<rect x="20" y="65" width="350" height="102" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<text x="40" y="106" font-weight="bold">iter外：準備同一清單</text><text x="40" y="145">先核對已知符合行數</text>
<path d="M195 171V205" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="195" y="244" text-anchor="middle">以下各自反覆量測</text>
<rect x="20" y="270" width="350" height="112" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="40" y="310" font-weight="bold">iter內：借讀方法</text><text x="40" y="349">巡訪 → contains → 行數</text>
<rect x="20" y="407" width="350" height="164" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="40" y="447" font-weight="bold">iter內：owned複本方法</text><text x="40" y="486">每行clone → contains</text><text x="40" y="525">每行複本收尾 → 行數</text>
<text x="195" y="613" text-anchor="middle" font-weight="bold">相同答案，範圍要清楚</text>
</g></svg>
