<svg xmlns="http://www.w3.org/2000/svg" width="400" height="380" viewBox="0 0 400 380" role="img" aria-labelledby="title desc">
  <title id="title">同一份等待狀態中的內部借用</title>
  <desc id="desc">controlled_work的外層Future保存owned release收端，recv的等待future借用這份收端。兩個框都位於同一份外層狀態內；向上藍箭頭表示借用，不是複製另一份收端。這是資料關係示意，不保證編譯器的實際欄位布局。</desc>
  <defs><marker id="borrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker></defs>
  <rect width="400" height="380" rx="12" fill="#fff"/>
  <g font-family="sans-serif" font-size="24" fill="#14273b" text-anchor="middle">
    <text x="200" y="32" font-weight="bold">同一份 future 的保存狀態</text>
    <rect x="16" y="50" width="368" height="278" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="200" y="83">外層：controlled_work</text>
    <rect x="40" y="102" width="320" height="67" rx="10" fill="#e9f7ef" stroke="#47886b" stroke-width="2"/>
    <text x="200" y="144">release：owned 收端</text>
    <path d="M200 237V181" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#borrow)"/>
    <text x="272" y="211" fill="#2563eb">borrow</text>
    <rect x="40" y="245" width="320" height="64" rx="10" fill="#e9f2ff" stroke="#5b7fa3" stroke-width="2"/>
    <text x="200" y="285">recv 的等待 future</text>
    <text x="200" y="365">箭頭：借用上面的收端</text>
  </g>
</svg>
