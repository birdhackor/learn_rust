<svg xmlns="http://www.w3.org/2000/svg" width="400" height="730" viewBox="0 0 400 730" role="img" aria-labelledby="title desc">
  <title id="title">查詢文字與查詢結果借用不同來源</title>
  <desc id="desc">上方query String擁有Rust文字，查詢用的str reference借用query。中間counts HashMap擁有Rust鍵及次數2，查詢文字只用來尋找鍵。下方found的Some reference借用map裡的次數2。藍色實線箭頭指向被借資料，綠色虛線箭頭表示查找。</desc>
  <defs>
    <marker id="borrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="lookup" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#15803d"/></marker>
  </defs>
  <rect width="400" height="730" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="24" fill="#172554">
    <rect x="20" y="20" width="360" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="40" y="56">query: String</text>
    <text x="40" y="90">擁有文字 Rust</text>
    <rect x="20" y="185" width="360" height="80" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="40" y="220">查詢用的 &amp;str</text>
    <text x="40" y="251">query.as_str()</text>
    <path d="M200,185 L200,108" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#borrow)"/>
    <text x="218" y="151" fill="#2563eb">借用文字</text>
    <rect x="20" y="360" width="360" height="145" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="40" y="395">counts: HashMap</text>
    <rect x="40" y="414" width="150" height="69" rx="8" fill="#ffffff" stroke="#15803d"/>
    <text x="52" y="443">鍵: String</text>
    <text x="52" y="474">Rust</text>
    <rect x="216" y="414" width="144" height="69" rx="8" fill="#ffffff" stroke="#15803d"/>
    <text x="228" y="443">值: usize</text>
    <text x="228" y="474">2</text>
    <path d="M112,265 L112,335 L8,335 L8,448 L40,448" fill="none" stroke="#15803d" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#lookup)"/>
    <text x="132" y="316" fill="#15803d">以文字查找</text>
    <rect x="20" y="595" width="360" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="40" y="628">found: Option&lt;&amp;usize&gt;</text>
    <text x="40" y="659">Some（借用次數）</text>
    <path d="M288,595 L288,480" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#borrow)"/>
    <text x="40" y="550" fill="#2563eb">借用 map 內的值</text>
    <text x="20" y="713" fill="#475569">實線：借用；虛線：查找</text>
  </g>
</svg>
