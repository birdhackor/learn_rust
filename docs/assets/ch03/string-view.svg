<svg xmlns="http://www.w3.org/2000/svg" width="400" height="470" viewBox="0 0 400 470" role="img" aria-labelledby="title desc">
  <title id="title">String 管理文字，str reference 借用同一份內容</title>
  <desc id="desc">上方 greeting 的 String 管理中間 heap 文字 Hello, Rust。下方 show 函式的 text shared reference 只借用相同文字，沒有第二份內容。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
  <rect width="400" height="470" rx="14" fill="#ffffff"/>
  <g font-family="Noto Sans CJK TC, sans-serif" fill="#172554">
    <text x="200" y="32" text-anchor="middle" font-size="24" font-weight="700">一份文字，兩種使用角色</text>
    <rect x="35" y="55" width="330" height="82" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="200" y="88" text-anchor="middle" font-size="24">greeting: String</text>
    <text x="200" y="119" text-anchor="middle" font-size="24">owner：負責管理與清理</text>
    <path d="M200 139 L200 210" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="220" y="182" font-size="24">管理</text>
    <rect x="35" y="215" width="330" height="84" rx="12" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
    <text x="200" y="249" text-anchor="middle" font-size="24">heap：Hello, Rust</text>
    <text x="200" y="280" text-anchor="middle" font-size="24">這裡只有同一份文字內容</text>
    <path d="M200 370 L200 305" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="220" y="346" font-size="24">借用</text>
    <rect x="35" y="375" width="330" height="74" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="200" y="406" text-anchor="middle" font-size="24">show 的 text: &amp;str</text>
    <text x="200" y="434" text-anchor="middle" font-size="24">讀內容，不接手清理責任</text>
  </g>
</svg>
