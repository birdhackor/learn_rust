<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-labelledby="title desc">
  <title id="title">停止後保存已提交與未提交輸入</title>
  <desc id="desc">jobs二，index三已回HTTP200並補入四。觀察Requested後停止fill，abort並收取一和四；五和六沒有task，成為Unstarted。最後以原索引整理Batch，整批理由為Requested。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#986000" stroke-width="1.5"/></marker></defs>
  <rect width="360" height="760" rx="12" fill="#f7f9fc"/>
  <g font-family="sans-serif" font-size="20" fill="#172a40">
    <text x="20" y="29" font-weight="700">手工材料：jobs = 2</text>
    <rect x="16" y="45" width="328" height="130" rx="10" fill="#e7efff" stroke="#3c65a6"/>
    <text x="30" y="70" font-weight="700">3 先完成，補入 4 之後</text>
    <text x="30" y="99">已提交：index 1、index 4</text>
    <text x="30" y="126">已保存：index 3 的 HTTP200</text>
    <text x="30" y="153">pending：index 5、index 6</text>
    <path d="M180 178 V199" fill="none" stroke="#986000" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="16" y="205" width="328" height="62" rx="10" fill="#fff2da" stroke="#a36512"/>
    <text x="30" y="230" font-weight="700">已觀察停止事件；不再 fill</text>
    <text x="30" y="255">StopEvent::Requested</text>
    <path d="M180 270 V291" fill="none" stroke="#986000" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="16" y="298" width="328" height="114" rx="10" fill="#e7efff" stroke="#3c65a6"/>
    <text x="30" y="322" font-weight="700">已提交的 tasks</text>
    <text x="30" y="350">abort_all → 逐份 join 到底</text>
    <text x="30" y="377">保留 Checked／TaskFailure</text>
    <text x="30" y="402">實際取消 → Cancelled</text>
    <path d="M180 416 V437" fill="none" stroke="#986000" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="16" y="444" width="328" height="78" rx="10" fill="#eef0f4" stroke="#64748b"/>
    <text x="30" y="470" font-weight="700">pending Input：沒有 Id</text>
    <text x="30" y="500">index 5、6 → Unstarted</text>
    <path d="M180 526 V548" fill="none" stroke="#986000" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="16" y="555" width="328" height="167" rx="10" fill="#e7f5ed" stroke="#38754f"/>
    <text x="30" y="580" font-weight="700">原 index 排序的 Batch</text>
    <text x="30" y="608">1 Cancelled　3 HTTP200</text>
    <text x="30" y="636">4 Cancelled　5 Unstarted</text>
    <text x="30" y="664">6 Unstarted</text>
    <text x="30" y="695">EndReason::Requested</text>
    <text x="20" y="749">數字是原 input_index，不是 Id</text>
  </g>
</svg>
