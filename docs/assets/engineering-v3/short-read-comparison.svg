<svg xmlns="http://www.w3.org/2000/svg" width="340" height="455" viewBox="0 0 340 455" role="img" aria-labelledby="title desc">
  <title id="title">不同短讀取切分，相同 byte 內容</title>
  <desc id="desc">左來源每次至多三格；四格buffer先收ABC後只剩一格，所以下次只收D，下一個比較段才收E。右來源逐一交A、B、C、D、E。兩邊各自填至四格或來源結尾後，比較第一段ABCD與第二段E，都相等。原始短讀取長度不同不能判定內容不同。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#39536a"/></marker></defs>
  <g font-family="Noto Sans CJK TC, sans-serif" font-size="24" fill="#16354b" text-anchor="middle">
    <text x="170" y="30">同一串 bytes：ABCDE</text>
    <rect x="10" y="48" width="320" height="120" rx="12" fill="#e7f1fa" stroke="#39536a"/>
    <text x="170" y="84">每次 read 的切分</text>
    <text x="170" y="120">左：ABC | D | E</text>
    <text x="170" y="154">右：A | B | C | D | E</text>
    <path d="M170 174 V214" stroke="#39536a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="10" y="220" width="320" height="65" rx="12" fill="#fff3cf" stroke="#39536a"/>
    <text x="170" y="261">各自填到 4 格或 EOF</text>
    <path d="M170 290 V330" stroke="#39536a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="10" y="337" width="320" height="108" rx="12" fill="#edf5e4" stroke="#39536a"/>
    <text x="170" y="375">第 1 段：ABCD = ABCD</text>
    <text x="170" y="413">第 2 段：E = E</text>
  </g>
</svg>
