<svg xmlns="http://www.w3.org/2000/svg" width="340" height="480" viewBox="0 0 340 480" role="img" aria-labelledby="title desc">
  <title id="title">一個候選桶可以包含兩種真正內容</title>
  <desc id="desc">手工把同為三 bytes 的 a AAA、b2 BBB、b1 BBB 放入相同 digest 候選桶。b2 與 a 不同建立新組，b1 先與 a 不同，再與 b2 相同，最後輸出 a 單一組及 b1 b2 的重複組。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#39536a"/></marker></defs>
  <g font-family="Noto Sans CJK TC, sans-serif" font-size="24" fill="#16354b" text-anchor="middle">
    <rect x="10" y="10" width="320" height="135" rx="12" fill="#e7f1fa" stroke="#39536a"/>
    <text x="170" y="46">手工設定同一 digest</text>
    <text x="170" y="87">a: AAA　b2: BBB</text>
    <text x="170" y="123">b1: BBB（都 3 bytes）</text>
    <path d="M170 151 V190" stroke="#39536a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="10" y="196" width="320" height="120" rx="12" fill="#fff3cf" stroke="#39536a"/>
    <text x="170" y="233">b1 先與 a 比：不同</text>
    <text x="170" y="268">再與 b2 比：相同</text>
    <text x="170" y="302">必須比較各組代表</text>
    <path d="M170 322 V360" stroke="#39536a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="10" y="367" width="320" height="103" rx="12" fill="#edf5e4" stroke="#39536a"/>
    <text x="170" y="406">真正群組 1：a</text>
    <text x="170" y="445">真正群組 2：b1、b2</text>
  </g>
</svg>
