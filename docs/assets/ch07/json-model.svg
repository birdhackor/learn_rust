<svg xmlns="http://www.w3.org/2000/svg" width="340" height="462" viewBox="0 0 340 462" role="img" aria-labelledby="title desc">
  <title id="title">JSON 文字轉成 owned Notebook，再產生新的 JSON 文字</title>
  <desc id="desc">上框是借入的 JSON 文字，from_str 解碼成中框的 Notebook。Notebook 擁有 title String、values Vec 和 archived bool，不借用輸入文字。to_string_pretty 借用 Notebook，產生下框的 owned String；資料相同，排版可以不同。</desc>
  <style>text{font-family:system-ui,sans-serif;font-size:18px;fill:#182d43}.label{font-weight:650}.box{fill:#f6f9fc;stroke:#829bb0;stroke-width:2}.model{fill:#e7f5eb;stroke:#347749;stroke-width:2}.arrow{fill:none;stroke:#245d8c;stroke-width:2}</style>
  <defs><marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#245d8c"/></marker></defs>
  <rect width="340" height="462" rx="10" fill="#fff"/>
  <rect x="10" y="10" width="320" height="117" rx="9" class="box"/>
  <text x="24" y="36" class="label">輸入：借來的 &amp;str</text>
  <text x="24" y="63">{"title":"筆記",</text>
  <text x="38" y="89">"values":[80,120],</text>
  <text x="38" y="115">"archived":false}</text>
  <path d="M170 130V173" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="188" y="158">from_str</text>
  <rect x="10" y="183" width="320" height="126" rx="9" class="model"/>
  <text x="24" y="211" class="label">Notebook 擁有欄位資料</text>
  <text x="24" y="241">title: String → 筆記</text>
  <text x="24" y="268">values: Vec&lt;i32&gt; → 80、120</text>
  <text x="24" y="295">archived: bool → false</text>
  <path d="M170 312V355" class="arrow" marker-end="url(#arrowhead)"/>
  <rect x="14" y="320" width="312" height="25" fill="#fff"/>
  <text x="20" y="338">to_string_pretty 借用模型</text>
  <rect x="10" y="365" width="320" height="87" rx="9" class="box"/>
  <text x="24" y="394" class="label">輸出：新的 owned String</text>
  <text x="24" y="421">以 JSON 保存同一份欄位內容</text>
  <text x="24" y="444">換行、縮排不必與輸入相同</text>
</svg>
