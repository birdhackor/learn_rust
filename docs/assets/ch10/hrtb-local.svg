<svg xmlns="http://www.w3.org/2000/svg" width="400" height="690" viewBox="0 0 400 690" role="img" aria-labelledby="title desc">
  <title id="title">HRTB 的能力與本次局部借用</title>
  <desc id="desc">F的介面對任一借用有效期都成立。with_local在自己的body建立value等於80，藍箭頭將本次reference借給callback，callback算出200，以綠箭頭交回函式外。函式結束時局部value結束，本例交回的是i32，沒有保存局部借用。</desc>
  <defs>
    <marker id="borrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1d4ed8"/></marker>
    <marker id="result" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#047857"/></marker>
  </defs>
  <rect width="400" height="690" rx="18" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="24" fill="#0f172a" text-anchor="middle">
    <rect x="16" y="16" width="368" height="112" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="200" y="49">F 的介面要求</text>
    <text x="200" y="82">任一借用有效期</text>
    <text x="200" y="113">都能作為本次輸入</text>
    <rect x="16" y="155" width="368" height="396" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="200" y="189">with_local 的 body</text>
    <rect x="40" y="214" width="320" height="73" rx="10" fill="white" stroke="#64748b"/>
    <text x="200" y="258">value = 80</text>
    <path d="M200 295 V332" stroke="#1d4ed8" stroke-width="3" marker-end="url(#borrow)"/>
    <text x="284" y="322" fill="#1d4ed8">本次 &amp;i32</text>
    <rect x="40" y="344" width="320" height="88" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="200" y="378">呼叫 callback 一次</text>
    <text x="200" y="411">計算 80 + 120</text>
    <path d="M200 440 V457 H340 V581" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#result)"/>
    <text x="175" y="498">局部 value 結束</text>
    <text x="175" y="531">函式結束</text>
    <rect x="40" y="593" width="320" height="78" rx="10" fill="#d1fae5" stroke="#047857"/>
    <text x="200" y="624">交回結果 200</text>
    <text x="200" y="656">本例 T = i32</text>
  </g>
</svg>
