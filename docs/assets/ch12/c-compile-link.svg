<svg xmlns="http://www.w3.org/2000/svg" width="390" height="620" viewBox="0 0 390 620" role="img" aria-labelledby="title desc">
  <title id="title">C 的個別編譯與連結</title>
  <desc id="desc">main.c 與 counts.c 各自包含 counts.h 的宣告，由 cc -c 產生 main.o 和 counts.o；linker 把兩個 object files 和標準函式庫的所需實作連結成 demo，再執行 demo。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#34495e"/></marker></defs>
  <rect width="390" height="620" rx="12" fill="#f5f8fc"/>
  <g font-family="sans-serif" font-size="24" fill="#172c44" text-anchor="middle">
    <rect x="39" y="20" width="312" height="54" rx="8" fill="#fce8d4" stroke="#995924" stroke-width="2"/>
    <text x="195" y="55">counts.h：介面宣告</text>
    <path d="M95 75V109" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M295 75V109" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="20" y="120" width="165" height="58" rx="8" fill="#e4eef9" stroke="#486989" stroke-width="2"/><rect x="205" y="120" width="165" height="58" rx="8" fill="#e0f1e7" stroke="#347359" stroke-width="2"/>
    <text x="102" y="157">main.c</text><text x="288" y="157">counts.c</text>
    <text x="102" y="212">cc -c</text><text x="288" y="212">cc -c</text>
    <path d="M102 227V260" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M288 227V260" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="20" y="272" width="165" height="58" rx="8" fill="#e4eef9" stroke="#486989" stroke-width="2"/><rect x="205" y="272" width="165" height="58" rx="8" fill="#e0f1e7" stroke="#347359" stroke-width="2"/>
    <text x="102" y="309">main.o</text><text x="288" y="309">counts.o</text>
    <path d="M102 331V363H170V395" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M288 331V363H220V395" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="39" y="408" width="312" height="87" rx="8" fill="#fce8d4" stroke="#995924" stroke-width="2"/>
    <text x="195" y="442">cc 啟動 linker</text><text x="195" y="477">＋標準函式庫的實作</text>
    <path d="M195 496V528" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="95" y="540" width="200" height="57" rx="8" fill="#e4eef9" stroke="#486989" stroke-width="2"/>
    <text x="195" y="577">demo：可執行檔</text>
  </g>
</svg>
