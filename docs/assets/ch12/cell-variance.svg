<svg xmlns="http://www.w3.org/2000/svg" width="500" height="510" viewBox="0 0 500 510" role="img" aria-labelledby="title desc">
  <title id="title">Cell的寫入能力使內容型別不能任意改換</title>
  <desc id="desc">同一份Cell原本儲存static reference。若另一個shared視圖可改成接受短borrow，就能set短命文字而破壞原契約；因此禁止這種型別替換。向上虛線箭頭是假設的寫迴路徑。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker></defs>
  <rect width="500" height="510" rx="16" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="24" fill="#0f172a" text-anchor="middle">
    <rect x="25" y="25" width="450" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="250" y="61">同一份 Cell&lt;&amp;'static str&gt;</text><text x="250" y="100">原契約：get 得到 static 借用</text>
    <rect x="25" y="230" width="450" height="95" rx="12" fill="#fff1f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="250" y="266">若另一視圖可改成</text><text x="250" y="303">&amp;Cell&lt;&amp;'short str&gt; …</text>
    <path d="M250 230V139" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
    <circle cx="250" cy="179" r="24" fill="#fff" stroke="#b91c1c" stroke-width="3"/><path d="M233 196L267 162" stroke="#b91c1c" stroke-width="3"/>
    <text x="130" y="185">禁止替換</text>
    <rect x="25" y="375" width="450" height="105" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="250" y="411">set(短命文字的 reference)</text><text x="250" y="449">就會破壞原 Cell 的承諾</text>
    <path d="M250 375V334" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  </g>
</svg>
