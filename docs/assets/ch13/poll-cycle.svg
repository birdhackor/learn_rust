<svg xmlns="http://www.w3.org/2000/svg" width="400" height="820" viewBox="0 0 400 820" role="img" aria-labelledby="title desc">
  <title id="title">通知與再次poll是不同動作</title>
  <desc id="desc">四框是同一個80工作按main操作順序的快照，不是struct布局。第一次由driver呼叫poll，尚未授權，保存Waker並回Pending，polls為1。driver呼叫release後released為true，wake讓通知數為1，但polls仍為1且completed為false。再由driver呼叫poll才交出Ready80，polls為2且completed為true。之後停止poll，使用Output。</desc>
  <defs><marker id="step" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker></defs>
  <rect width="400" height="820" rx="12" fill="#fff"/>
  <g font-family="sans-serif" font-size="24" fill="#14273b" text-anchor="middle">
    <text x="200" y="34" font-weight="bold">同一份 work，兩次檢查</text>
    <rect x="22" y="56" width="356" height="143" rx="12" fill="#e9f2ff" stroke="#5b7fa3" stroke-width="2"/>
    <text x="200" y="92" font-weight="bold">1. driver 第一次 poll</text>
    <text x="200" y="125">released = false</text>
    <text x="200" y="158">保存 Waker，回 Pending</text>
    <text x="200" y="187">polls = 1</text>
    <path d="M200 210V247" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#step)"/>
    <rect x="22" y="260" width="356" height="173" rx="12" fill="#fff2e6" stroke="#a97749" stroke-width="2"/>
    <text x="200" y="296" font-weight="bold">2. driver 呼叫 release</text>
    <text x="200" y="329">released = true</text>
    <text x="200" y="362">wake：通知數 = 1</text>
    <text x="200" y="395">polls = 1，尚未完成</text>
    <text x="200" y="423">completed = false</text>
    <path d="M200 444V481" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#step)"/>
    <rect x="22" y="494" width="356" height="145" rx="12" fill="#e9f7ef" stroke="#47886b" stroke-width="2"/>
    <text x="200" y="530" font-weight="bold">3. driver 再次 poll</text>
    <text x="200" y="566">交出 Ready(80)</text>
    <text x="200" y="600">polls = 2</text>
    <text x="200" y="628">completed = true</text>
    <path d="M200 650V687" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#step)"/>
    <rect x="22" y="700" width="356" height="73" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="200" y="745" font-weight="bold">4. 停止 poll，使用 Output</text>
    <text x="200" y="804">灰箭頭：main 的操作順序</text>
  </g>
</svg>
