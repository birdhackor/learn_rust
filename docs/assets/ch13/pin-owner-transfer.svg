<svg xmlns="http://www.w3.org/2000/svg" width="400" height="670" viewBox="0 0 400 670" role="img" aria-labelledby="title desc">
  <title id="title">移交固定的 owner，資料保留原位置</title>
  <desc id="desc">first是交接之前的Pin Box owner；灰色箭頭表示ownership交接給next，first之後不再可用。next的藍色pointer箭頭仍找到同一份heap中的PinnedNote。value欄位位於V，saved仍記錄V；紫色箭頭只是地址記錄，不表示可透過raw pointer讀取資料。</desc>
  <defs>
    <marker id="move" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <marker id="owner" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
    <marker id="saved" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="400" height="670" rx="12" fill="#fff"/>
  <g font-family="sans-serif" font-size="24" fill="#14273b" text-anchor="middle">
    <text x="200" y="34" font-weight="bold">移交 owner，資料留原處</text>
    <rect x="60" y="60" width="280" height="62" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="200" y="100" fill="#64748b">first：交接前的 owner</text>
    <path d="M200 132V177" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#move)"/>
    <text x="200" y="209" fill="#64748b">ownership 交接</text>
    <rect x="60" y="231" width="280" height="62" rx="10" fill="#e9f2ff" stroke="#2563eb" stroke-width="2"/>
    <text x="200" y="271">next：接手的 owner</text>
    <path d="M200 301V345" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#owner)"/>
    <rect x="30" y="358" width="340" height="202" rx="12" fill="#e9f7ef" stroke="#47886b" stroke-width="2"/>
    <text x="200" y="394" font-weight="bold">同一份 PinnedNote</text>
    <rect x="64" y="409" width="272" height="60" rx="8" fill="#fff" stroke="#47886b" stroke-width="2"/>
    <text x="200" y="448">value = 80（位置 V）</text>
    <text x="200" y="516" fill="#7c3aed">saved = V</text>
    <path d="M298 512H352V441H340" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#saved)"/>
    <text x="200" y="599">heap 資料沒有另建一份</text>
    <text x="200" y="640">紫箭頭：欄位地址記錄</text>
  </g>
</svg>
