<svg xmlns="http://www.w3.org/2000/svg" width="400" height="820" viewBox="0 0 400 820" role="img" aria-labelledby="title desc">
  <title id="title">同鎖檢查與登記保留兩種可完成的次序</title>
  <desc id="desc">每個彩色框都是同一State鎖的一次持鎖區段。上段先由事件取得鎖存120且沒有通知位置，解鎖後Future首次取得鎖取120，直接Ready。下段先由poll取得鎖看到沒有結果並登記Waker，解鎖後事件取得鎖存80並取走Waker；事件解鎖後才wake，driver之後再poll取得Ready80。灰箭頭表示次序，不是時間長度；wake仍不執行poll。</desc>
  <defs><marker id="step" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
  <rect width="400" height="820" rx="12" fill="#fff"/>
  <g font-family="sans-serif" font-size="24" fill="#14273b" text-anchor="middle">
    <text x="200" y="34" font-weight="bold">1. 先事件，再首次 poll</text>
    <rect x="22" y="55" width="356" height="100" rx="12" fill="#fff2e6" stroke="#a97749" stroke-width="2"/>
    <text x="200" y="89" font-weight="bold">事件持鎖區段</text>
    <text x="200" y="127">存 120，沒有 waiting</text>
    <path d="M200 163V193" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#step)"/>
    <rect x="22" y="205" width="356" height="100" rx="12" fill="#e9f2ff" stroke="#5b7fa3" stroke-width="2"/>
    <text x="200" y="239" font-weight="bold">poll 持鎖區段</text>
    <text x="200" y="277">取 120，之後回 Ready</text>
    <text x="200" y="341">不需先等通知</text>
    <path d="M22 368H378" stroke="#cbd5e1" stroke-width="2"/>
    <text x="200" y="406" font-weight="bold">2. 先 poll，再事件</text>
    <rect x="22" y="427" width="356" height="100" rx="12" fill="#e9f2ff" stroke="#5b7fa3" stroke-width="2"/>
    <text x="200" y="461" font-weight="bold">poll 持鎖區段</text>
    <text x="200" y="499">沒有結果，登記 Waker</text>
    <path d="M200 535V565" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#step)"/>
    <rect x="22" y="577" width="356" height="100" rx="12" fill="#fff2e6" stroke="#a97749" stroke-width="2"/>
    <text x="200" y="611" font-weight="bold">事件持鎖區段</text>
    <text x="200" y="649">存 80，取走 waiting</text>
    <path d="M200 685V715" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#step)"/>
    <text x="200" y="751" font-weight="bold">解鎖後 wake</text>
    <text x="200" y="787">driver 再 poll 才 Ready(80)</text>
  </g>
</svg>
