<svg xmlns="http://www.w3.org/2000/svg" width="336" height="1110" viewBox="0 0 336 1110" role="img" aria-labelledby="title desc">
<title id="title">subtotal 第一筆呼叫的 A、B、C</title>
<desc id="desc">A：main 保存 price 120 和 count 3，first 尚未取得初始值。B：main 等待，subtotal 這次呼叫保存 price 120、count 3、result 360。C：subtotal 回傳數值 360 後呼叫結束，main 的 first 保存 360。虛線表示時間前進，實線表示回傳數值。</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
 <marker id="time" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
</defs>
<style>
 text { font-family: "Noto Sans CJK TC", "Noto Sans", sans-serif; font-size:18px; fill:#172033; }
 .heading { font-size:21px; font-weight:700; }
 .strong { font-weight:700; }
 .muted { fill:#475569; }
</style>
<rect width="336" height="1110" rx="12" fill="#f8fafc"/>
<text x="20" y="36" class="heading">
<tspan x="20" dy="0">第一筆：120 × 3 → 360</tspan>
</text>
<rect x="16" y="57" width="304" height="224" rx="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="30" y="88" class="strong">
<tspan x="30" dy="0">A　呼叫 subtotal 之前</tspan>
</text>
<rect x="32" y="105" width="272" height="111" rx="9" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="48" y="133" class="strong">
<tspan x="48" dy="0">main 的 frame</tspan>
</text>
<text x="48" y="165" class="">
<tspan x="48" dy="0">price = 120</tspan>
<tspan x="48" dy="27">count = 3</tspan>
</text>
<text x="30" y="247" class="">
<tspan x="30" dy="0">下一步接收結果，命名 first</tspan>
</text>
<line x1="62" y1="284" x2="62" y2="340" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#time)" stroke-dasharray="6 5"/>
<text x="82" y="320" class="">
<tspan x="82" dy="0">時間：進入這次呼叫</tspan>
</text>
<rect x="16" y="350" width="304" height="384" rx="9" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
<text x="30" y="382" class="strong">
<tspan x="30" dy="0">B　subtotal 回傳之前</tspan>
</text>
<rect x="32" y="400" width="272" height="112" rx="9" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="48" y="429" class="strong">
<tspan x="48" dy="0">main 的 frame：等待</tspan>
</text>
<text x="48" y="460" class="">
<tspan x="48" dy="0">price = 120</tspan>
<tspan x="48" dy="27">count = 3</tspan>
</text>
<rect x="32" y="528" width="272" height="155" rx="9" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
<text x="48" y="558" class="strong">
<tspan x="48" dy="0">subtotal 的這次 frame</tspan>
</text>
<text x="48" y="591" class="">
<tspan x="48" dy="0">price = 120</tspan>
<tspan x="48" dy="27">count = 3</tspan>
<tspan x="48" dy="27">result = 360</tspan>
</text>
<text x="30" y="714" class="">
<tspan x="30" dy="0">此時先顯示 B 的小計 360</tspan>
</text>
<line x1="62" y1="738" x2="62" y2="807" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="82" y="774" class="">
<tspan x="82" dy="0">回傳數值 360 給 main</tspan>
</text>
<rect x="16" y="820" width="304" height="222" rx="9" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
<text x="30" y="852" class="strong">
<tspan x="30" dy="0">C　main 繼續</tspan>
</text>
<rect x="32" y="869" width="272" height="138" rx="9" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="48" y="900" class="strong">
<tspan x="48" dy="0">main 的 frame</tspan>
</text>
<text x="48" y="931" class="">
<tspan x="48" dy="0">price = 120</tspan>
<tspan x="48" dy="27">count = 3</tspan>
<tspan x="48" dy="27">first = 360</tspan>
</text>
<text x="20" y="1080" class="">
<tspan x="20" dy="0">subtotal 的這次 frame 已結束</tspan>
</text>
</svg>
