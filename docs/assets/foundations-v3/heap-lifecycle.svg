<svg xmlns="http://www.w3.org/2000/svg" width="336" height="1340" viewBox="0 0 336 1340" role="img" aria-labelledby="title desc">
<title id="title">heap 區塊 H1 的使用與歸還</title>
<desc id="desc">T1 內層工作建立含 120、80 的 H1；T2 交給外層找到 H1 的位置資訊；T3 內層已結束，外層仍使用同一個 H1；T4 用完歸還空間，沒有再通向 H1 的有效使用箭頭。虛線表示時間前進，實線表示沿位置找到內容。</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
 <marker id="time" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
</defs>
<style>
 text { font-family: "Noto Sans CJK TC", "Noto Sans", sans-serif; font-size:18px; fill:#172033; }
 .heading { font-size:21px; font-weight:700; }
 .strong { font-weight:700; }
 .muted { fill:#475569; }
</style>
<rect width="336" height="1340" rx="12" fill="#f8fafc"/>
<text x="20" y="36" class="heading">
<tspan x="20" dy="0">同一 H1：建立、使用、歸還</tspan>
</text>
<rect x="16" y="59" width="304" height="247" rx="9" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="30" y="91" class="strong">
<tspan x="30" dy="0">T1　內層建立明細</tspan>
</text>
<rect x="32" y="108" width="272" height="53" rx="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="48" y="141" class="">
<tspan x="48" dy="0">內層保存：H1 的位置</tspan>
</text>
<line x1="62" y1="164" x2="62" y2="206" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="82" y="192" class="">
<tspan x="82" dy="0">沿位置找到內容</tspan>
</text>
<rect x="32" y="215" width="272" height="75" rx="9" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
<text x="48" y="243" class="strong">
<tspan x="48" dy="0">heap 區塊 H1</tspan>
</text>
<text x="48" y="272" class="">
<tspan x="48" dy="0">單價 120、80</tspan>
</text>
<line x1="62" y1="309" x2="62" y2="365" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#time)" stroke-dasharray="6 5"/>
<text x="82" y="344" class="">
<tspan x="82" dy="0">時間：交出位置資訊</tspan>
</text>
<rect x="16" y="375" width="304" height="247" rx="9" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="30" y="407" class="strong">
<tspan x="30" dy="0">T2　交給外層後續使用</tspan>
</text>
<rect x="32" y="424" width="272" height="53" rx="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="48" y="457" class="">
<tspan x="48" dy="0">外層接收：H1 的位置</tspan>
</text>
<line x1="62" y1="480" x2="62" y2="522" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="82" y="508" class="">
<tspan x="82" dy="0">沿位置找到內容</tspan>
</text>
<rect x="32" y="531" width="272" height="75" rx="9" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
<text x="48" y="559" class="strong">
<tspan x="48" dy="0">heap 區塊 H1</tspan>
</text>
<text x="48" y="588" class="">
<tspan x="48" dy="0">單價 120、80</tspan>
</text>
<line x1="62" y1="625" x2="62" y2="681" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#time)" stroke-dasharray="6 5"/>
<text x="82" y="660" class="">
<tspan x="82" dy="0">時間：內層工作結束</tspan>
</text>
<rect x="16" y="691" width="304" height="247" rx="9" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="30" y="723" class="strong">
<tspan x="30" dy="0">T3　內層已結束</tspan>
</text>
<rect x="32" y="740" width="272" height="53" rx="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="48" y="773" class="">
<tspan x="48" dy="0">外層仍保存：H1 的位置</tspan>
</text>
<line x1="62" y1="796" x2="62" y2="838" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="82" y="824" class="">
<tspan x="82" dy="0">沿位置找到內容</tspan>
</text>
<rect x="32" y="847" width="272" height="75" rx="9" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
<text x="48" y="875" class="strong">
<tspan x="48" dy="0">heap 區塊 H1</tspan>
</text>
<text x="48" y="904" class="">
<tspan x="48" dy="0">單價 120、80</tspan>
</text>
<line x1="62" y1="941" x2="62" y2="997" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#time)" stroke-dasharray="6 5"/>
<text x="82" y="966" class="">
<tspan x="82" dy="0">時間：外層用完</tspan>
<tspan x="82" dy="27">歸還 H1 空間</tspan>
</text>
<rect x="16" y="1007" width="304" height="247" rx="9" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="30" y="1039" class="strong">
<tspan x="30" dy="0">T4　空間已歸還配置器</tspan>
</text>
<rect x="32" y="1056" width="272" height="53" rx="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="48" y="1089" class="">
<tspan x="48" dy="0">外層不再使用這份明細</tspan>
</text>
<text x="32" y="1143" class="muted">
<tspan x="32" dy="0">沒有繼續使用的箭頭</tspan>
</text>
<rect x="32" y="1163" width="272" height="75" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
<text x="48" y="1192" class="strong">
<tspan x="48" dy="0">H1 原先使用的空間</tspan>
</text>
<text x="48" y="1221" class="">
<tspan x="48" dy="0">現在可供再次配置</tspan>
</text>
<text x="20" y="1296" class="">
<tspan x="20" dy="0">歸還空間不等於把內容清為零</tspan>
</text>
</svg>
