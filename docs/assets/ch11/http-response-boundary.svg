<svg xmlns="http://www.w3.org/2000/svg" width="340" height="462" viewBox="0 0 340 462" role="img" aria-labelledby="title desc">
  <title id="title">HTTP 回應的兩種完成界線</title>
  <desc id="desc">由上往下，先送 GET 並追蹤最多五次導向，取得最後 status 與 headers。預設到此即可交報告；body 模式再讀完整內容，最後才交報告。兩段同步等待各有十秒限制。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs>
  <rect width="340" height="462" rx="12" fill="#f8fafc"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="170" y="28" font-size="18" font-weight="bold">同一個 GET，兩種完成界線</text>
    <rect x="20" y="46" width="300" height="69" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="170" y="72" font-size="16">送出 GET</text>
    <text x="170" y="97" font-size="15">追蹤最多 5 次 redirect</text>
    <path d="M170 115V126" fill="none" stroke="#334155" stroke-width="2"/>
    <path d="M170 150V169" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="170" y="143" font-size="14">等待 final response：10 秒</text>
    <rect x="20" y="175" width="300" height="92" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="170" y="200" font-size="16">取得最後 status ＋ headers</text>
    <text x="170" y="226" font-size="15">預設：現在可交出報告</text>
    <text x="170" y="249" font-size="14">尚未要求讀完整 body</text>
    <path d="M170 267V277" fill="none" stroke="#334155" stroke-width="2"/>
    <path d="M170 302V324" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="170" y="294" font-size="14">只有 --body 才走下一步</text>
    <rect x="20" y="330" width="300" height="80" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="170" y="355" font-size="16">text：讀完整 body</text>
    <text x="170" y="378" font-size="14">這一步另受 10 秒限制</text>
    <text x="170" y="399" font-size="14">完成後才交出包含 body 的報告</text>
    <text x="170" y="440" font-size="14">任一步驟失敗，保留該階段的原因</text>
  </g>
</svg>
