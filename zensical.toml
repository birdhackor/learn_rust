[project]
site_name = "Rust 教學"
site_description = "面向具備基本 Python 經驗讀者的正體中文 Rust 教學。"
docs_dir = "docs"
site_dir = "site"
strict = true
site_url = "https://birdhackor.github.io/learn_rust/"
repo_url = "https://github.com/birdhackor/learn_rust"
edit_uri = "edit/main/docs/"
# 編寫中的章節暫不發布，首次上線只包含首頁。
exclude_docs = """
getting-started/**
fundamentals/**
ownership/**
"""
nav = [{ "首頁" = "index.md" }]

[project.theme]
language = "zh-Hant"
font = false
features = [
  "content.code.copy",
  "content.code.annotate",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切換至深色模式"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "切換至淺色模式"

[project.markdown_extensions]
admonition = {}
attr_list = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
toc.permalink = true
