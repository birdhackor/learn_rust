[workspace]
members = [
    "examples/hello-world",
    "examples/ch01-basics",
    "examples/ch02-ownership",
    "examples/ch03-data",
    "examples/ch04-traits",
    "examples/ch04-lifetimes",
    "examples/ch05-errors",
    "examples/ch06-iterators",
    "examples/ch08-smart-pointers",
    "examples/ch07-cli/tooling",
    "examples/ch07-cli/io-text",
    "examples/ch07-cli/io-bytes",
    "examples/ch07-cli/path-cli",
    "examples/ch07-cli/clap",
    "examples/ch07-cli/json",
    "examples/ch07-cli/fixtures",
    "examples/ch07-cli/search",
    "examples/ch09-engineering",
    "examples/ch09-build-script",
    "examples/ch09-files",
    "examples/ch09-content",
    "examples/ch10-concurrency",
    "examples/ch11-http",
    "examples/ch11-async/foundations",
    "examples/ch11-async/tasks",
    "examples/ch11-async/bounded",
    "examples/ch11-async/cancellation",
    "examples/ch11-async/timing",
    "examples/ch11-async/http-single",
    "examples/ch11-async/local-service",
    "examples/ch12-unsafe",
    "examples/ch12-ffi",
    "examples/ch13-futures",
    "examples/ch14-api",
    "examples/ch14-property",
    "examples/ch14-performance",
    "examples/ch14-profiling",
    "examples/ch14-model-checking",
    "examples/ch14-macros",
    "examples/ch14-macros/derive",
    "examples/ch14-macros/derive-consumer",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
ch01-basics = { path = "examples/ch01-basics" }

[profile.release]
opt-level = 3
overflow-checks = true
