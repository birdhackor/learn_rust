name: Check and publish Rust documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_checks:
        description: 忽略成功結果快取，重新實跑全部 Rust／C／Miri 檢查
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Prepare only website dependencies
        run: bash scripts/bootstrap.sh site
      - name: Check publication tool contracts without downloading archives
        run: |
          source scripts/env.sh
          uv run --locked --no-default-groups --group site --python '3.14+gil' python -m unittest discover -s tests -v
      - name: Build and validate the current documentation
        run: bash scripts/build-site.sh
      - name: Upload documentation preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-site
          path: outputs/site/
          if-no-files-found: error
          retention-days: 7
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: outputs/site/

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Reuse downloaded crates and Cargo build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ../.learn-rust-tools/cargo/registry
            ../.learn-rust-tools/cargo/git
            target
            examples/intro-workspace/target
            examples/ch09-engineering/lesson-workspace/target
            examples/ch09-content/lesson-workspace/target
          key: learn-rust-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: learn-rust-cargo-${{ runner.os }}-
      - name: Prepare only runtime verification dependencies
        run: bash scripts/bootstrap.sh runtime
      - name: Prepare fixed Miri toolchain
        run: |
          source scripts/env.sh
          rustup toolchain install nightly-2026-10-01 --profile minimal --component miri --component rust-src
      - name: Identify Rust execution inputs
        id: rust
        run: |
          source scripts/env.sh
          uv run --locked --no-default-groups --python '3.14+gil' python scripts/check-execution.py key --kind rust --github-output "$GITHUB_OUTPUT"
      - name: Identify Miri execution inputs
        id: miri
        run: |
          source scripts/env.sh
          uv run --locked --no-default-groups --python '3.14+gil' python scripts/check-execution.py key --kind miri --github-output "$GITHUB_OUTPUT"
      - name: Restore complete successful verification bundles
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: outputs/checks/
          key: learn-rust-results-${{ runner.os }}-${{ steps.rust.outputs.key }}-${{ steps.miri.outputs.key }}
      - name: Validate or rerun all Rust, C, fixture, and Miri checks
        env:
          FORCE_CHECKS: ${{ inputs.force_checks && 'true' || 'false' }}
        run: |
          source scripts/env.sh
          force_args=()
          if [[ "$FORCE_CHECKS" == true ]]; then force_args=(--force); fi
          uv run --locked --no-default-groups --python '3.14+gil' python scripts/check-execution.py ensure --kind rust "${force_args[@]}"
          uv run --locked --no-default-groups --python '3.14+gil' python scripts/check-execution.py ensure --kind miri "${force_args[@]}"
      - name: Preserve verification logs and source identities
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-verification
          path: outputs/checks/
          if-no-files-found: ignore
          retention-days: 7

  check:
    if: always()
    needs: [site, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require both current site and complete runtime verification
        env:
          SITE_RESULT: ${{ needs.site.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: test "$SITE_RESULT" = success && test "$RUNTIME_RESULT" = success

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
